<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gabriel Homes — Kenyan property agency on the coast</title>
<meta name="description" content="Gabriel Homes is a Kenyan property agency founded in 2026 and centred on the coast. Every listing passes five checks before it goes live. Serving Mombasa, Nairobi and Kilifi.">
<!--
  ============================================================================
  GABRIEL HOMES — standalone index page (one file: HTML + CSS + JS)
  Content policy (r17 content audit): owner-confirmed facts ONLY.
  Every claim below traces to approved site copy or the r17 fact set:
    - Founded 2026, based on the Kenyan coast (views.py / about meta, r17)
    - Serving Mombasa, Nairobi & Kilifi (about meta, r17)
    - 5 checks before a listing goes live (hero facts, r17)
    - Every listing checked by the team before it goes live (about meta)
    - Services copy: templates/core/services.html (approved, DB counts removed)
    - Principles: templates/core/services.html (years-of-trading claim removed)
    - Contact: templates/core/contact.html (phone / WhatsApp / email / office)
  Deliberately EXCLUDED: demo-DB counts, listing/agency counters, years of
  experience, agent names, testimonials, awards — nothing invented.
  ============================================================================

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
/* ================= tokens (mirrors static/css/tokens.css) ================ */
:root{
  --cream:#faf8f4; --white:#fff; --sand:#d8c9b8; --taupe:#6b5e53;
  --clay:#965634; --brown:#5a4032; --espresso:#2a211c; --ink:#211e1b;
  --burnt:#af4715; --ember:#eda07a;
  --font-sans:"Geist","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"Geist Mono","JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --font-display:"Fraunces","Iowan Old Style",Georgia,"Times New Roman",serif;
  --track-tight:-.02em; --track-display:-.04em; --track-mono:.02em;
  --leading-tight:1.2; --leading-prose:1.65;
  --radius-card:20px; --radius-pill:100px;
  --shadow-card:0 .6px 1.57px -1.5px rgba(42,33,28,.14),0 2.29px 5.95px -3px rgba(42,33,28,.12),0 10px 26px -4.5px rgba(42,33,28,.03);
  --shadow-card-hover:0 24px 48px -14px rgba(42,33,28,.24),0 8px 16px -6px rgba(42,33,28,.10),0 2px 4px rgba(42,33,28,.06);
  --container-max:1280px;
  --gutter:clamp(1rem,.6rem + 2vw,2.5rem);
  --section-pad-y:clamp(3rem,2rem + 4vw,6rem);
  --section-pad-y-lg:clamp(4.5rem,3rem + 6vw,8rem);
  --ease:cubic-bezier(.2,.6,.2,1);
  --t-med:.3s;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  font-family:var(--font-sans);background:var(--cream);color:var(--ink);
  line-height:var(--leading-prose);font-size:1rem;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
img,svg{display:block;max-width:100%}
a{color:inherit}
.container{max-width:var(--container-max);margin-inline:auto;padding-inline:var(--gutter)}
.section{padding-block:var(--section-pad-y)}
.section--lg{padding-block:var(--section-pad-y-lg)}

/* type helpers */
.section-tag{
  font-family:var(--font-mono);font-size:.8125rem;letter-spacing:var(--track-mono);
  text-transform:uppercase;color:var(--clay);margin-bottom:1.25rem;
}
.section-tag--light{color:var(--ember)}
.eyebrow{
  display:inline-block;font-family:var(--font-mono);font-size:.8125rem;
  letter-spacing:var(--track-mono);text-transform:uppercase;color:var(--taupe);
  margin-bottom:.75rem;
}
.display{
  font-family:var(--font-display);font-weight:500;line-height:var(--leading-tight);
  letter-spacing:var(--track-display);
}
h1.display{font-size:clamp(2.75rem,2rem + 3.4vw,4.75rem);max-width:16ch}
h2.display{font-size:clamp(2rem,1.7rem + 1.6vw,3rem);max-width:22ch}
.prose{max-width:62ch;color:#3d362f}
.prose p+p{margin-top:1.1em}
.lede{font-size:clamp(1.0625rem,1rem + .5vw,1.25rem);color:var(--taupe);max-width:52ch}

/* buttons */
.btn{
  display:inline-flex;align-items:center;gap:.5rem;text-decoration:none;
  font-weight:500;font-size:.9375rem;border-radius:var(--radius-pill);
  padding:.8rem 1.5rem;transition:background var(--t-med) var(--ease),color var(--t-med) var(--ease),box-shadow var(--t-med) var(--ease);
}
.btn--primary{background:var(--burnt);color:var(--white)}
.btn--primary:hover{background:var(--brown)}
.btn--outline{box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink)}
.btn--outline:hover{background:var(--ink);color:var(--cream)}
.btn--onlight-ghost{color:var(--clay);padding-inline:0;border-radius:0}
.btn--onlight-ghost:hover{color:var(--brown)}
.btn__arrow{font-family:var(--font-sans)}
:focus-visible{outline:2px solid var(--burnt);outline-offset:3px;border-radius:4px}

/* reveal-on-scroll (JS adds .is-in; no-JS fallback shows everything) */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.reveal.is-in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
.no-js .reveal{opacity:1;transform:none}

/* ============================ header ==================================== */
.site-header{
  position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--cream) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid color-mix(in srgb,var(--sand) 55%,transparent);
  transition:box-shadow var(--t-med) var(--ease);
}
.site-header.is-scrolled{box-shadow:var(--shadow-card)}
.header-in{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:64px}
.wordmark{
  font-family:var(--font-display);font-weight:600;font-size:1.25rem;
  letter-spacing:var(--track-tight);text-decoration:none;white-space:nowrap;
}
.wordmark b{color:var(--clay);font-weight:600}
.main-nav{display:flex;align-items:center;gap:1.75rem}
.main-nav a{
  text-decoration:none;font-size:.875rem;font-weight:500;color:var(--taupe);
  transition:color var(--t-med) var(--ease);
}
.main-nav a:hover{color:var(--ink)}
.main-nav .nav-cta{
  color:var(--white);background:var(--ink);border-radius:var(--radius-pill);
  padding:.5rem 1.1rem;
}
.main-nav .nav-cta:hover{background:var(--burnt);color:var(--white)}
.nav-toggle{
  display:none;border:0;background:none;cursor:pointer;padding:.5rem;
  color:var(--ink);border-radius:8px;
}
.nav-toggle svg{width:24px;height:24px}
@media (max-width:809px){
  .nav-toggle{display:block}
  .main-nav{
    position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:flex-start;
    gap:0;background:var(--cream);border-bottom:1px solid var(--sand);
    padding:.5rem var(--gutter) 1.25rem;display:none;
  }
  .main-nav.is-open{display:flex}
  .main-nav a{padding:.75rem 0;font-size:1rem;width:100%}
  .main-nav .nav-cta{margin-top:.5rem;text-align:center;justify-content:center;display:inline-flex}
}

/* ============================= hero ===================================== */
.hero{padding-block:clamp(4rem,3rem + 5vw,7.5rem) clamp(3.5rem,2.5rem + 4vw,6rem)}
.hero__tagline{margin-bottom:1.5rem}
.hero h1{margin-bottom:1.5rem}
.hero h1 em{font-style:italic;color:var(--clay)}
.hero__sub{margin-bottom:2.5rem}
.hero__actions{display:flex;flex-wrap:wrap;gap:.75rem;margin-bottom:3.5rem}
.facts-row{
  display:grid;grid-template-columns:repeat(3,1fr);gap:0;
  border-top:1px solid color-mix(in srgb,var(--sand) 70%,transparent);
}
.fact{padding:1.75rem 1.5rem 0 0}
.fact+.fact{border-left:1px solid color-mix(in srgb,var(--sand) 70%,transparent);padding-left:1.5rem}
.fact__number{
  font-family:var(--font-display);font-weight:500;font-size:clamp(1.9rem,1.5rem + 1.8vw,2.75rem);
  line-height:var(--leading-tight);letter-spacing:var(--track-display);display:block;
}
.fact__label{
  font-size:.875rem;color:var(--taupe);display:block;margin-top:.4rem;max-width:24ch;
}
@media (max-width:640px){
  .facts-row{grid-template-columns:1fr}
  .fact{padding:1.25rem 0 0}
  .fact+.fact{border-left:0;border-top:1px solid color-mix(in srgb,var(--sand) 70%,transparent);padding-left:0;margin-top:1.25rem}
}
